<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean Chem Intel — Product Database</title>
<style>
  :root {
    --bg: #1a1d24;
    --surface: #232830;
    --surface2: #2d333d;
    --border: #3a4049;
    --text: #e8e6e3;
    --muted: #8b8d91;
    --accent: #6cbf84;
    --accent-dim: #4a8a5e;
    --grade-a: #4caf50;
    --grade-b: #8bc34a;
    --grade-c: #ffc107;
    --grade-d: #ff9800;
    --grade-f: #f44336;
    --flag: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .header {
    background: linear-gradient(135deg, #2d333d, #1a1d24);
    border-bottom: 1px solid var(--border);
    padding: 16px;
    text-align: center;
  }
  .header h1 {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
  }
  .header p {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .controls {
    padding: 12px 16px;
    max-width: 700px;
    margin: 0 auto;
  }
  .search-row {
    display: flex;
    gap: 8px;
  }
  .search-box {
    flex: 1;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--muted); }
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
    justify-content: center;
  }
  .filter-btn {
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 0.8rem;
    cursor: pointer;
  }
  .filter-btn.active {
    background: var(--accent-dim);
    color: var(--text);
    border-color: var(--accent);
  }
  .results {
    max-width: 700px;
    margin: 0 auto;
    padding: 8px 16px;
  }
  .product-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .product-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .product-title {
    font-size: 1rem;
    font-weight: 600;
  }
  .product-brand {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .product-category {
    font-size: 0.65rem;
    background: var(--surface2);
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 4px;
    display: inline-block;
  }
  .grade-badge {
    min-width: 44px;
    text-align: center;
  }
  .grade-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: 700;
    color: white;
    margin: 0 auto;
  }
  .grade-label {
    font-size: 0.6rem;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 2px;
  }
  .ingredients-section {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  .ingredients-label {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .ingredient-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .ing-chip {
    padding: 4px 8px;
    background: var(--surface2);
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .ing-chip.unknown { color: var(--flag); }
  .ing-chip .grade-dot {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    color: white;
  }
  .product-detail {
    display: none;
    margin-top: 10px;
    padding: 10px;
    background: var(--surface2);
    border-radius: 6px;
    font-size: 0.85rem;
  }
  .product-detail.show { display: block; }
  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
  }
  .detail-label { color: var(--muted); }
  .no-results {
    text-align: center;
    padding: 30px;
    color: var(--muted);
  }
  .legend {
    max-width: 700px;
    margin: 0 auto;
    padding: 12px 16px;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .legend-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 2px;
  }
  .stats {
    text-align: center;
    padding: 10px;
    color: var(--muted);
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Clean Chem Intel</h1>
  <p>47 Popular Cleaning Products — Ingredient Analysis</p>
</div>

<div class="controls">
  <div class="search-row">
    <input type="text" class="search-box" id="search" placeholder="Search products or ingredients..." oninput="render()">
  </div>
  <div class="filter-row" id="filters"></div>
</div>

<div class="stats" id="stats"></div>

<div class="results" id="results"></div>

<div class="legend">
  <div class="legend-row">
    <div class="legend-item"><div class="legend-dot" style="background:#4caf50"></div> A</div>
    <div class="legend-item"><div class="legend-dot" style="background:#8bc34a"></div> B</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ffc107"></div> C</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div> D</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f44336"></div> F</div>
    <div class="legend-item"><div class="legend-dot" style="background:#555"></div> ?</div>
  </div>
</div>

<script>
const PRODUCTS = [
  {name:"Windex Original",brand:"SC Johnson",cat:"Glass Cleaner",ings:["Water","Isopropanol","Propylene Glycol","Butyloxyethanol","Ammonium Hydroxide","Fragrance"]},
  {name:"Formula 409",brand:"Clorox",cat:"All-Purpose",ings:["Water","Lauramine Oxide","Ethanolamine","Quaternary Ammonium","Fragrance"]},
  {name:"Mr. Clean",brand:"P&G",cat:"All-Purpose",ings:["Water","Alkyldimethylamine Oxide","Sodium Carbonate","Benzisothiazolinone","Fragrance"]},
  {name:"Pine-Sol",brand:"Clorox",cat:"All-Purpose",ings:["Water","Alcohol Ethoxylates","Fragrance","Citric Acid"]},
  {name:"Lysol All-Purpose",brand:"Reckitt",cat:"All-Purpose",ings:["Quaternary Ammonium","Water","Phenoxyisopropanol","Ethanol","Fragrance"]},
  {name:"Fabuloso",brand:"Colgate-Palmolive",cat:"All-Purpose",ings:["Water","Sodium Dodecylbenzenesulfonate","Fragrance","Sodium Laureth Sulfate","Citric Acid"]},
  {name:"Simple Green",brand:"Sunshine Makers",cat:"All-Purpose",ings:["Water","Surfactant","Tetrasodium Glutamate Diacetate","Sodium Bicarbonate","Fragrance"]},
  {name:"Method All-Purpose",brand:"SC Johnson",cat:"Eco-Friendly",ings:["Water","Decyl Glucoside","Lauryl Glucoside","Citric Acid","Fragrance","Limonene"]},
  {name:"Mrs. Meyer's Multi-Surface",brand:"SC Johnson",cat:"Eco-Friendly",ings:["Water","Sodium Citrate","Decyl Glucoside","Citric Acid","Fragrance"]},
  {name:"Seventh Gen All-Purpose",brand:"Unilever",cat:"Eco-Friendly",ings:["Water","Octyl/Decyl Glucoside","Sodium Citrate","Citric Acid","Essential Oils"]},
  {name:"Clorox Bleach",brand:"Clorox",cat:"Disinfectant",ings:["Water","Sodium Hypochlorite","Sodium Chloride","Sodium Hydroxide"]},
  {name:"Lysol Disinfectant Spray",brand:"Reckitt",cat:"Disinfectant",ings:["Ethanol","Quaternary Ammonium","Water","Butane","Propane","Fragrance"]},
  {name:"Lysol Toilet Bowl",brand:"Reckitt",cat:"Toilet Cleaner",ings:["Hydrochloric Acid","Water","Fragrance"]},
  {name:"Scrubbing Bubbles",brand:"SC Johnson",cat:"Bathroom",ings:["Water","Isobutane","Benzalkonium Chloride","Fragrance"]},
  {name:"Comet Bathroom",brand:"KIK",cat:"Bathroom",ings:["Water","Citric Acid","Sodium Hydroxide","Fragrance"]},
  {name:"Tilex Mold & Mildew",brand:"Clorox",cat:"Bathroom",ings:["Water","Sodium Hypochlorite","Sodium Hydroxide","Lauramine Oxide","Fragrance"]},

  {name:"Swiffer WetJet",brand:"P&G",cat:"Floor",ings:["Water","Propylene Glycol Butyl Ether","Didecyldimonium Chloride","Fragrance"]},
  {name:"Green Works",brand:"Clorox",cat:"Eco-Friendly",ings:["Water","Caprylyl/Capryl Glucoside","Ethanol","Citric Acid","Limonene","Fragrance"]},
  {name:"ECOS Dishmate",brand:"ECOS",cat:"Eco-Friendly",ings:["Water","Sodium Coco-Sulfate","Lauramine Oxide","Phenoxyethanol","Citric Acid"]},
  {name:"Biokleen All-Purpose",brand:"Biokleen",cat:"Eco-Friendly",ings:["Water","Sodium Lauryl Sulfate","Cocamidopropyl Betaine","Lauramine Oxide","Limonene"]},
  {name:"Dr. Bronner's Sal Suds",brand:"Dr. Bronner's",cat:"Eco-Friendly",ings:["Water","Sodium Lauryl Sulfate","Lauryl Glucoside","Essential Oils","Limonene"]},
  {name:"Grove Co. Multi-Purpose",brand:"Grove",cat:"Eco-Friendly",ings:["Water","Coco-Glucoside","Lauramine Oxide","Citric Acid","Phenoxyethanol"]},
  {name:"Dawn Ultra",brand:"P&G",cat:"Dish Soap",ings:["Water","Sodium Lauryl Sulfate","Sodium Laureth Sulfate","Lauramine Oxide","Fragrance","Methylisothiazolinone"]},
  {name:"Palmolive",brand:"Colgate-Palmolive",cat:"Dish Soap",ings:["Water","Sodium Laureth Sulfate","Sodium Lauryl Sulfate","Lauramine Oxide","Fragrance","Methylisothiazolinone"]},
  {name:"Tide",brand:"P&G",cat:"Laundry",ings:["Water","Alcohol Ethoxylate","Sodium Laureth Sulfate","Enzymes","Fragrance"]},
  {name:"Gain",brand:"P&G",cat:"Laundry",ings:["Water","Alcohol Ethoxylate","Sodium Laureth Sulfate","Fragrance"]},
  {name:"Cascade",brand:"P&G",cat:"Dishwasher",ings:["Sodium Carbonate","Sodium Percarbonate","Sodium Silicate","Enzymes","Fragrance"]},
  {name:"Finish",brand:"Reckitt",cat:"Dishwasher",ings:["Sodium Carbonate","Sodium Percarbonate","Sodium Silicate","Enzymes","Fragrance"]},
  {name:"Arm & Hammer",brand:"Church & Dwight",cat:"Laundry",ings:["Water","Sodium Carbonate","Sodium Laureth Sulfate","Fragrance","Enzymes"]},
  {name:"Seventh Gen Dish",brand:"Unilever",cat:"Dish Soap",ings:["Water","Sodium Lauryl Sulfate","Cocamidopropyl Betaine","Lauramine Oxide","Methylisothiazolinone"]},
  {name:"Mrs. Meyer's Dish",brand:"SC Johnson",cat:"Dish Soap",ings:["Water","Sodium Lauryl Sulfate","Cocamidopropyl Betaine","Fragrance","Methylisothiazolinone"]},
  {name:"Method Dish",brand:"SC Johnson",cat:"Dish Soap",ings:["Water","Sodium Lauryl Sulfate","Cocamidopropyl Betaine","Fragrance","Limonene","Methylisothiazolinone"]},
  {name:"Isopropyl Alcohol (BMVC)",brand:"TBD",cat:"Disinfectant",ings:["Isopropyl Alcohol"]},
  {name:"Castile Soap (BMVC)",brand:"Dr. Bronner's",cat:"All-Purpose",ings:["Castile Soap","Spring Water"]},
  {name:"Essential Oil Spray (BMVC)",brand:"Homemade",cat:"All-Purpose",ings:["Spring Water","Isopropyl Alcohol","Tea Tree Oil","Lavender Oil","Lemon Oil","Peppermint Oil","Eucalyptus Oil"]},
  {name:"Norwex + Water (BMVC)",brand:"Norwex",cat:"Physical",ings:["Norwex Cloth","Spring Water"]},
  {name:"Pumice Stone (BMVC)",brand:"N/A",cat:"Physical",ings:["Pumice Stone"]},
];

const INGS = {
  "Water":{g:null,s:"No hazard",ev:"High"},
  "Spring Water":{g:null,s:"No hazard",ev:"High"},
  "Isopropanol":{g:"H225,H319,H336",s:"Flammable, eye irritant, drowsiness",ev:"High",gr:{derm:"B",resp:"C",work:"C"}},
  "Isopropyl Alcohol":{g:"H225,H319,H336",s:"Flammable, eye irritant, drowsiness",ev:"High",gr:{derm:"B",resp:"C",work:"C"}},
  "Ethanol":{g:"H225,H319",s:"Highly flammable, eye irritant",ev:"High",gr:{derm:"B",work:"C"}},
  "Sodium Hypochlorite":{g:"H314,H318,H400",s:"Corrosive, severe eye damage, aquatic toxicity",ev:"High",gr:{derm:"F",env:"F",work:"D"}},
  "Sodium Hydroxide":{g:"H290,H314,H318",s:"Corrosive, severe burns",ev:"High",gr:{derm:"F",work:"D"}},
  "Hydrochloric Acid":{g:"H290,H314,H335",s:"Corrosive, respiratory irritant",ev:"High",gr:{derm:"F",resp:"D",work:"D"}},
  "Quaternary Ammonium":{g:"H302,H314,H400",s:"Harmful if swallowed, corrosive, aquatic toxicity",ev:"High",gr:{derm:"F",env:"F",work:"D"}},
  "Benzalkonium Chloride":{g:"H302,H314,H400",s:"Harmful if swallowed, corrosive, aquatic toxicity",ev:"High",gr:{derm:"F",env:"F",work:"D"}},
  "Sodium Lauryl Sulfate":{g:"H228,H302,H315,H319,H335",s:"Flammable solid, skin/eye irritant",ev:"High",gr:{derm:"C",resp:"C",work:"C"}},
  "Sodium Laureth Sulfate":{g:"H315,H319",s:"Skin and eye irritant",ev:"High",gr:{derm:"C"}},
  "Limonene":{g:"H226,H304,H315,H317,H400",s:"Flammable, skin sensitizer, aspiration hazard, aquatic toxicity",ev:"High",gr:{derm:"D",resp:"D",env:"F"}},
  "Lauramine Oxide":{g:"H315,H319",s:"Skin and eye irritant",ev:"High",gr:{derm:"C"}},
  "Fragrance":{g:"H317",s:"May cause allergic skin reaction",ev:"Low",gr:{derm:"D"}},
  "Citric Acid":{g:"H319",s:"Eye irritant",ev:"High",gr:{derm:"C"}},
  "Oxalic Acid":{g:"H302,H312",s:"Harmful if swallowed or contacted",ev:"High",gr:{derm:"D",organ:"D"}},
  "Glycolic Acid":{g:"H314",s:"Corrosive",ev:"High",gr:{derm:"D"}},
  "Lactic Acid":{g:"H315",s:"Skin irritant",ev:"High",gr:{derm:"C"}},
  "Sodium Carbonate":{g:"H319",s:"Eye irritant",ev:"High",gr:{derm:"B"}},
  "Sodium Bicarbonate":{g:null,s:"Low hazard",ev:"High"},
  "Sodium Percarbonate":{g:"H271,H302,H318",s:"Oxidizer, harmful if swallowed, severe eye damage",ev:"High",gr:{derm:"D",work:"C"}},
  "Calcium Carbonate":{g:null,s:"Low hazard abrasive",ev:"High"},
  "Feldspar":{g:null,s:"Natural abrasive, low hazard",ev:"High"},
  "Limestone":{g:null,s:"Natural abrasive, low hazard",ev:"High"},
  "Castile Soap":{g:"H315,H319",s:"Mild skin/eye irritant, biodegradable",ev:"Low",gr:{derm:"C"}},
  "Tea Tree Oil":{g:"H304,H315,H317,H335,H412",s:"Skin sensitizer, aspiration hazard, respiratory irritant",ev:"Low",gr:{derm:"D",resp:"C"}},
  "Lavender Oil":{g:"H315,H317,H319",s:"Skin sensitizer and irritant",ev:"Low",gr:{derm:"D"}},
  "Lemon Oil":{g:"H226,H304,H315,H317,H400",s:"Flammable, sensitizer, aquatic toxicity",ev:"Low",gr:{derm:"D",env:"F"}},
  "Peppermint Oil":{g:"H315,H317,H319,H335",s:"Skin/eye irritant, respiratory irritant",ev:"Low",gr:{derm:"D",resp:"C"}},
  "Eucalyptus Oil":{g:"H304,H315,H317,H335",s:"Skin sensitizer, respiratory irritant, toxic to pets",ev:"Low",gr:{derm:"D",resp:"C"}},
  "Decyl Glucoside":{g:null,s:"Plant-derived surfactant, biodegradable",ev:"Low",gr:{derm:"B"}},
  "Lauryl Glucoside":{g:null,s:"Plant-derived surfactant, biodegradable",ev:"Low",gr:{derm:"B"}},
  "Sodium Coco-Sulfate":{g:"H315,H319",s:"Plant-derived surfactant, skin/eye irritant",ev:"Low",gr:{derm:"C"}},
  "Cocamidopropyl Betaine":{g:"H315,H319",s:"Mild surfactant, skin/eye irritant",ev:"High",gr:{derm:"B"}},
  "Methylisothiazolinone":{g:"H317",s:"Strong skin sensitizer, preservative",ev:"High",gr:{derm:"D"}},
  "Benzisothiazolinone":{g:"H302,H315,H317,H400",s:"Harmful if swallowed, skin irritant, aquatic toxicity",ev:"High",gr:{derm:"D",env:"D"}},
  "Phenoxyethanol":{g:"H302,H315,H319",s:"Harmful if swallowed, skin/eye irritant",ev:"High",gr:{derm:"C"}},
  "Propylene Glycol":{g:null,s:"Low hazard solvent",ev:"High",gr:{derm:"A"}},
  "Butyloxyethanol":{g:"H302,H315,H319",s:"Harmful if swallowed, skin/eye irritant",ev:"High",gr:{derm:"D",work:"C"}},
  "Ammonium Hydroxide":{g:"H314,H318",s:"Corrosive, severe eye damage",ev:"High",gr:{derm:"D",work:"C"}},
  "Alcohol Ethoxylate":{g:"H315,H319",s:"Skin/eye irritant, surfactant",ev:"High",gr:{derm:"C"}},
  "Enzymes":{g:null,s:"Biological catalysts, may cause respiratory sensitization",ev:"High",gr:{resp:"B"}},
  "Trichloroisocyanuric Acid":{g:"H271,H302,H319,H410",s:"Oxidizer, harmful, aquatic toxicity",ev:"High",gr:{derm:"D",env:"F"}},
  "Tetrasodium Glutamate Diacetate":{g:null,s:"Chelating agent, low hazard",ev:"Low"},
  "Norwex Cloth":{g:null,s:"Microfiber cloth, no chemicals",ev:"High"},
  "Pumice Stone":{g:null,s:"Natural volcanic rock, no chemicals",ev:"High"},
};

function gradeClass(g){ return g ? "grade-"+g.toLowerCase() : "grade-unknown"; }
function gradeOrder(g){ return {A:0,B:1,C:2,D:3,F:4}[g] ?? 5; }

function productGrade(ings){
  let worst = "A";
  for(const n of ings){
    const d = INGS[n];
    if(!d || !d.gr) continue;
    if(d.ev !== "High" && d.ev !== "Medium") continue;
    for(const dim of ["resp","derm","endo","organ","env","work"]){
      const g = d.gr[dim];
      if(g && gradeOrder(g) > gradeOrder(worst)) worst = g;
    }
  }
  return worst;
}

function render(){
  const q = document.getElementById("search").value.toLowerCase();
  const activeFilters = [...document.querySelectorAll(".filter-btn.active")].map(b=>b.dataset.cat);
  let list = PRODUCTS;
  if(q) list = list.filter(p=> p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.ings.some(i=>i.toLowerCase().includes(q)));
  if(activeFilters.length) list = list.filter(p=> activeFilters.includes(p.cat));

  document.getElementById("stats").textContent = `Showing ${list.length} of ${PRODUCTS.length} products`;

  const html = list.map((p,i)=>{
    const grade = productGrade(p.ings);
    const ingChips = p.ings.map(n=>{
      const d = INGS[n];
      const known = !!d;
      const g = d?.gr?.derm || d?.gr?.resp || null;
      return `<span class="ing-chip ${known?"":"unknown"}" onclick="toggleDetail(${i})">${n} ${d?`<span class="grade-dot ${gradeClass(g)}">${g||"?"}</span>`:""}</span>`;
    }).join("");
    return `<div class="product-card">
      <div class="product-header">
        <div><div class="product-title">${p.name}</div><div class="product-brand">${p.brand}</div><span class="product-category">${p.cat}</span></div>
        <div class="grade-badge"><div class="grade-circle ${gradeClass(grade)}">${grade}</div><div class="grade-label">Overall</div></div>
      </div>
      <div class="ingredients-section"><div class="ingredients-label">Ingredients (${p.ings.length})</div><div class="ingredient-chips">${ingChips}</div></div>
      <div class="product-detail" id="det-${i}">${p.ings.map(n=>{const d=INGS[n];return d?`<div class="detail-row"><span>${n}</span><span>${d.s||""}</span></div>`:`<div class="detail-row" style="color:var(--flag)"><span>${n}</span><span>Unknown ingredient</span></div>`;}).join("")}</div>
    </div>`;
  }).join("");
  document.getElementById("results").innerHTML = html || `<div class="no-results">No products found</div>`;
}

function toggleDetail(i){
  const el = document.getElementById("det-"+i);
  if(el) el.classList.toggle("show");
}

function buildFilters(){
  const cats = [...new Set(PRODUCTS.map(p=>p.cat))].sort();
  document.getElementById("filters").innerHTML = `<button class="filter-btn active" data-cat="" onclick="toggleFilter(this)">All</button>` + cats.map(c=>`<button class="filter-btn" data-cat="${c}" onclick="toggleFilter(this)">${c}</button>`).join("");
}

function toggleFilter(btn){
  if(btn.dataset.cat===""){ document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); }
  else { btn.classList.toggle("active"); document.querySelector(".filter-btn[data-cat='']").classList.remove("active"); }
  render();
}

buildFilters();
render();
</script>
</body>
</html>
